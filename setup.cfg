[metadata]
name = automated-test-generation
version = 1.0.0
description = Automated test generation system with AI-powered test creation
author = Your Name
author_email = your.email@example.com

[flake8]
max-line-length = 88
extend-ignore = E203, W503, E501
exclude = 
    .git,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    .venv,
    venv,
    playwright-ai-framework,
    build,
    dist,
    *.egg-info
per-file-ignores =
    __init__.py:F401
max-complexity = 20
count = true
statistics = true
show-source = true

[black]
line-length = 88
target-version = py39,py310,py311
include = \.pyi?$
exclude = /(\.eggs|\.git|\.hg|\.mypy_cache|\.tox|\.venv|_build|buck-out|build|dist|playwright-ai-framework)/

[isort]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = 
    .venv/*
    venv/*
    playwright-ai-framework/*
    .git/*
    __pycache__/*
    .pytest_cache/*
    .mypy_cache/*

[mypy]
python_version = 3.9
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
exclude = (?x)(
      ^playwright-ai-framework/
    | ^\.venv/
    | ^venv/
    | ^build/
    | ^dist/
    | \.egg-info/
  )

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    slow: marks tests as slow running
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80

[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    */__init__.py
    */venv/*
    */.venv/*
    */playwright-ai-framework/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
