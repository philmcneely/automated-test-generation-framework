name: Automated Tests
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps
      - name: Clear Python cache
        run: |
          find . -name "*.pyc" -delete
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
      - name: Run tests
        run: pytest tests/test_agent_runner_pom.py tests/test_github_indexer.py tests/test_jira_integration.py tests/test_jira_poller_with_validation.py tests/test_validator.py -v
