name: Index Knowledge Base

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Repository URL to index (e.g., https://github.com/owner/repo.git)'
        required: true
        default: 'https://github.com/philmcneely/playwright-ai-framework.git'
      branch:
        description: 'Branch to index'
        required: false
        default: 'main'
      enable_auto_commit:
        description: 'Automatically commit updated knowledge base'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install -r requirements.txt requests

      - name: Run GitHub indexer
        env:
          GITHUB_REPO_URL: ${{ github.event.inputs.repo_url }}
          GITHUB_BRANCH: ${{ github.event.inputs.branch }}
        run: make index-github

      - name: Commit updated KB
        if: ${{ github.event.inputs.enable_auto_commit == 'true' }}
        run: |
          git config user.name "auto-indexer"
          git config user.email "auto-indexer@users.noreply.github.com"
          git add knowledge_base_schema.json
          git commit -m "chore: update KB via indexer" || echo "No changes"
          git push

      - name: Upload updated knowledge base
        if: ${{ github.event.inputs.enable_auto_commit == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: updated-knowledge-base
          path: knowledge_base_schema.json
